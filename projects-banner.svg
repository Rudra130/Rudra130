<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 130" width="100%" height="130">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="projBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Neon Header Gradient -->
    <linearGradient id="projTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glowing Cyber Beam -->
    <linearGradient id="cyberBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <filter id="projGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .proj-grid {
        stroke: rgba(99, 102, 241, 0.07);
        stroke-width: 1;
      }
      .laser-stream {
        stroke-dasharray: 120, 240;
        animation: laserFlow 3.8s linear infinite;
      }
      .laser-stream-rev {
        stroke-dasharray: 80, 200;
        animation: laserFlowRev 4.5s linear infinite;
      }
      .pulse-dot {
        animation: dotPulse 2s ease-in-out infinite alternate;
      }
      @keyframes laserFlow {
        0% { stroke-dashoffset: 360; }
        100% { stroke-dashoffset: -360; }
      }
      @keyframes laserFlowRev {
        0% { stroke-dashoffset: -280; }
        100% { stroke-dashoffset: 280; }
      }
      @keyframes dotPulse {
        0% { opacity: 0.3; transform: scale(0.9); }
        100% { opacity: 1; transform: scale(1.15); }
      }
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .font-mono {
        font-family: "JetBrains Mono", Consolas, "Courier New", monospace;
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="920" height="130" rx="14" fill="url(#projBg)" stroke="#1e293b" stroke-width="1.4" />

  <!-- Grid Pattern -->
  <g class="proj-grid">
    <line x1="0" y1="35" x2="920" y2="35" />
    <line x1="0" y1="70" x2="920" y2="70" />
    <line x1="0" y1="105" x2="920" y2="105" />
    <line x1="160" y1="0" x2="160" y2="130" />
    <line x1="460" y1="0" x2="460" y2="130" />
    <line x1="760" y1="0" x2="760" y2="130" />
  </g>

  <!-- Ambient Light Halos -->
  <circle cx="80" cy="65" r="90" fill="#38bdf8" opacity="0.08" filter="url(#projGlow)" />
  <circle cx="840" cy="65" r="90" fill="#c084fc" opacity="0.09" filter="url(#projGlow)" />

  <!-- Animated Laser Streams -->
  <path d="M 20,65 Q 230,15 460,65 T 900,65" fill="none" stroke="url(#cyberBeam)" stroke-width="2.2" class="laser-stream" filter="url(#projGlow)" />
  <path d="M 20,65 Q 230,115 460,65 T 900,65" fill="none" stroke="url(#cyberBeam)" stroke-width="1.6" class="laser-stream-rev" filter="url(#projGlow)" />

  <!-- Terminal Window Controls Top Left -->
  <g transform="translate(24, 18)">
    <circle cx="0" cy="0" r="4.5" fill="#ef4444" opacity="0.85" />
    <circle cx="14" cy="0" r="4.5" fill="#f59e0b" opacity="0.85" />
    <circle cx="28" cy="0" r="4.5" fill="#10b981" opacity="0.85" />
  </g>

  <!-- System Status Indicator Top Right -->
  <g transform="translate(730, 18)">
    <rect x="-10" y="-8" width="165" height="20" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
    <circle cx="0" cy="2" r="3.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="10" y="5" fill="#a5b4fc" font-size="9.5" class="font-mono" font-weight="700">SYS_STATUS: DEPLOYED</text>
  </g>

  <!-- Main Section Title -->
  <text x="460" y="58" text-anchor="middle" fill="url(#projTextGrad)" font-size="24" class="font-sans" font-weight="900" letter-spacing="2" filter="url(#projGlow)">
    FEATURED ARCHITECTURE &amp; PROJECTS
  </text>

  <!-- Dynamic Subtitle -->
  <text x="460" y="86" text-anchor="middle" fill="#94a3b8" font-size="12.5" class="font-mono" font-weight="500" letter-spacing="0.5">
    Autonomous AI Tool-Calling Graphs &#x2022; Spring Boot Microservices &#x2022; Biometric Zero-Trust
  </text>

  <!-- Interactive Terminal Prompt Footer -->
  <g transform="translate(260, 112)">
    <text x="0" y="0" fill="#38bdf8" font-size="11" class="font-mono" font-weight="700">➜</text>
    <text x="18" y="0" fill="#64748b" font-size="10.5" class="font-mono">production/services</text>
    <text x="165" y="0" fill="#38bdf8" font-size="10.5" class="font-mono">git:(main)</text>
    <text x="238" y="0" fill="#10b981" font-size="10.5" class="font-mono">mvn clean verify --agentic-mode</text>
    <rect x="445" y="-10" width="7" height="12" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
