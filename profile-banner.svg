<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="280">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Glowing Neon Text Gradients -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="80%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <linearGradient id="electricCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .cyber-grid {
        stroke: rgba(99, 102, 241, 0.08);
        stroke-width: 1;
      }
      .pulse-glow {
        animation: pulse 4s ease-in-out infinite;
      }
      .floating-stream {
        stroke-dasharray: 180, 360;
        animation: streamFlow 4.5s linear infinite;
      }
      .badge-glow {
        animation: badgePulse 3s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.06); }
      }
      @keyframes streamFlow {
        0% { stroke-dashoffset: 540; }
        100% { stroke-dashoffset: -540; }
      }
      @keyframes badgePulse {
        0% { filter: drop-shadow(0 0 2px rgba(56, 189, 248, 0.2)); }
        100% { filter: drop-shadow(0 0 7px rgba(192, 132, 252, 0.6)); }
      }
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .font-mono {
        font-family: "JetBrains Mono", Consolas, "Courier New", monospace;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="920" height="280" rx="18" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Grid Blueprint Lines -->
  <g class="cyber-grid">
    <line x1="0" y1="50" x2="920" y2="50" />
    <line x1="0" y1="110" x2="920" y2="110" />
    <line x1="0" y1="170" x2="920" y2="170" />
    <line x1="0" y1="230" x2="920" y2="230" />
    <line x1="120" y1="0" x2="120" y2="280" />
    <line x1="320" y1="0" x2="320" y2="280" />
    <line x1="580" y1="0" x2="580" y2="280" />
    <line x1="780" y1="0" x2="780" y2="280" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="160" cy="80" r="140" fill="#38bdf8" opacity="0.06" class="pulse-glow" filter="url(#neonGlow)" />
  <circle cx="800" cy="200" r="150" fill="#c084fc" opacity="0.08" class="pulse-glow" filter="url(#neonGlow)" style="animation-delay: -2s;" />

  <!-- Animated Sinusoidal Data Highways -->
  <path d="M 30,140 Q 250,50 480,140 T 890,140" fill="none" stroke="url(#electricCyan)" stroke-width="2.5" class="floating-stream" filter="url(#softGlow)" />
  <path d="M 30,150 Q 250,230 480,140 T 890,140" fill="none" stroke="url(#electricCyan)" stroke-width="1.8" class="floating-stream" style="animation-delay: -2.2s;" />

  <!-- Header Badge: Available for Work / Role -->
  <g transform="translate(320, 24)">
    <rect width="280" height="26" rx="13" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
    <circle cx="16" cy="13" r="4.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite" />
    </circle>
    <text x="30" y="17" fill="#c7d2fe" font-size="11" class="font-mono" font-weight="700" letter-spacing="1">SOFTWARE ENGINEER &#x2022; BACKEND &amp; AI</text>
  </g>

  <!-- Main Hero Greeting & Name -->
  <text x="460" y="96" text-anchor="middle" fill="url(#nameGrad)" font-size="42" class="font-sans" font-weight="900" letter-spacing="1.5" filter="url(#softGlow)">
    Hi, I'm Rudra Tiwari &#x1F44B;
  </text>

  <!-- Dynamic Typing Tagline -->
  <text x="460" y="132" text-anchor="middle" fill="#94a3b8" font-size="15" class="font-mono" font-weight="500">
    Distributed Systems &#x2022; Spring Boot Microservices &#x2022; Generative &amp; Agentic AI
  </text>

  <!-- Metric Badges Row -->
  <g transform="translate(90, 165)" class="badge-glow">
    <!-- Badge 1: Microservices -->
    <g transform="translate(0, 0)">
      <rect width="160" height="38" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" />
      <text x="80" y="24" text-anchor="middle" fill="#38bdf8" font-size="12" class="font-mono" font-weight="700">&#x2699;&#xFE0F; Microservices &amp; REST</text>
    </g>

    <!-- Badge 2: Agentic AI & LangGraph -->
    <g transform="translate(175, 0)">
      <rect width="180" height="38" rx="8" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" />
      <text x="90" y="24" text-anchor="middle" fill="#818cf8" font-size="12" class="font-mono" font-weight="700">&#x1F9E0; Agentic AI &amp; LangGraph</text>
    </g>

    <!-- Badge 3: LeetCode Rating -->
    <g transform="translate(370, 0)">
      <rect width="175" height="38" rx="8" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.2" />
      <text x="87" y="24" text-anchor="middle" fill="#f59e0b" font-size="12" class="font-mono" font-weight="700">&#x1F3C6; LeetCode 1812 (600+)</text>
    </g>

    <!-- Badge 4: Observability & Security -->
    <g transform="translate(560, 0)">
      <rect width="180" height="38" rx="8" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2" />
      <text x="90" y="24" text-anchor="middle" fill="#10b981" font-size="12" class="font-mono" font-weight="700">&#x1F510; OAuth2 &amp; OpenTelemetry</text>
    </g>
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(50, 245)">
    <circle cx="10" cy="5" r="3" fill="#38bdf8" />
    <text x="22" y="9" fill="#64748b" font-size="11" class="font-mono">LOCATION: GURUGRAM / DELHI NCR, INDIA</text>

    <text x="820" y="9" text-anchor="end" fill="#64748b" font-size="11" class="font-mono">ORACLE CERTIFIED GENERATIVE &amp; AGENTIC AI</text>
  </g>
</svg>
